<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command Station</title>
<meta name="theme-color" content="#F4F0E8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400..800&amp;display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/cards.css">
</head>
<body>
<div id="stage">
  <header id="header">
    <div id="companion" aria-hidden="true"></div>

    <div class="hd-main">
      <h1 id="greeting">Good morning</h1>
      <p id="subline" class="muted"></p>
      <div class="pills-row">
        <div id="pills" class="pills"></div>
        <button id="open-settings" class="pill key" type="button" aria-label="Open settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
        </button>
      </div>
    </div>

    <section id="heat" class="card heat" aria-label="Heat index">
      <div class="heat-top">
        <span class="heat-title">Heat index</span>
        <span id="heat-now" class="heat-now">--°</span>
        <span id="heat-band" class="tag"></span>
        <span class="grow"></span>
        <span id="heat-air" class="muted small"></span>
      </div>
      <div class="heat-plot">
        <svg id="heat-svg" viewBox="0 0 360 70" preserveAspectRatio="none" role="img" aria-label="Heat index over 24 hours"></svg>
        <div id="heat-dot" class="heat-dot"></div>
        <div id="heat-peak-dot" class="heat-peak-dot"></div>
        <div id="heat-peak" class="heat-peak"></div>
      </div>
      <div class="heat-axis"><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>12 AM</span></div>
    </section>

    <div class="clock">
      <div class="clock-time"><span id="clock-hm">9:41</span><span id="clock-ap">AM</span></div>
      <div id="clock-date" class="clock-date muted"></div>
    </div>
  </header>

  <main id="board">
    <div class="col col-left">
      <section id="card-today" class="card pad today" aria-label="Today"></section>
      <section id="card-tasks" class="card pad tasks" aria-label="Tasks"></section>
    </div>

    <div class="col col-mid">
      <section id="card-camera" class="card cam" aria-label="Camera"></section>
      <section id="card-printer" class="card prn" aria-label="Printer"></section>
    </div>

    <div class="col col-right">
      <div style="display:flex;flex-direction:column;gap:14px;flex:none">
        <section id="tile-writing" class="tile tile-write" aria-label="Writing"></section>
        <div class="tiles2">
          <section id="tile-focus" class="tile tile-focus" aria-label="Focus"></section>
          <section id="tile-device" class="tile tile-dev" aria-label="Device"></section>
        </div>
      </div>
      <section id="card-research" class="card research" aria-label="Research supervision"></section>
      <form id="ask" class="card ask">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex:none;fill:var(--orange)"><path d="M12 1.5l2.4 7.1 7.1 2.4-7.1 2.4L12 20.5l-2.4-7.1L2.5 11l7.1-2.4z"/></svg>
        <input id="ask-input" type="text" aria-label="Ask Claude" placeholder="Ask Claude anything…" autocomplete="off">
        <button type="submit" aria-label="Send to Claude"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke:var(--on-orange)"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </form>
    </div>
  </main>

  <!-- Settings -->
  <div id="settings" class="overlay" hidden>
    <form id="settings-form" class="panel card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="panel-head">
        <h2 id="settings-title">Settings</h2>
        <span class="grow"></span>
        <span class="muted small">Saved on this device only</span>
      </div>

      <div class="grid2">
        <label class="field"><span>Your name</span><input id="f-name" type="text" autocomplete="off" placeholder="Shown in the greeting"></label>
        <label class="field"><span>Theme</span>
          <select id="f-theme"><option value="light">Light</option><option value="night">Night</option><option value="auto">Auto (follows device)</option></select>
        </label>
        <label class="field"><span>Latitude</span><input id="f-lat" type="text" inputmode="decimal" autocomplete="off"></label>
        <label class="field"><span>Longitude</span><input id="f-lon" type="text" inputmode="decimal" autocomplete="off"></label>
      </div>
      <p class="hint muted">Coordinates drive the weather, heat index and rain outlook. Long-press your spot in Google Maps to copy them.</p>

      <label class="field"><span>Data link (Google Apps Script web app URL)</span><input id="f-backend" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec"></label>
      <label class="field"><span>Token</span><input id="f-token" type="password" autocomplete="off" placeholder="The TOKEN you set in Script properties"></label>

      <div class="status-line"><span id="test-result" class="muted" role="status"></span></div>

      <div class="panel-actions">
        <button type="button" id="s-reset" class="btn ghost">Reset</button>
        <span class="grow"></span>
        <button type="button" id="s-test" class="btn">Test connection</button>
        <button type="button" id="s-cancel" class="btn">Close</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
